name: Isolated SDK checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Install locked public development dependencies without scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Synthetic SDK and hard-gated standalone import checks
        run: node scripts/check-isolated-sdk.mjs
      - name: Audit runtime archive
        run: node scripts/audit-package.mjs
